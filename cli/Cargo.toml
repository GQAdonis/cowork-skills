[package]
name = "cowork"
version = "0.1.4"
edition = "2024"
description = "CLI tool for managing Claude Code skills - install, generate, and organize skills across AI coding agents"
authors = ["Zhang Handong <pku.alex.zhang@gmail.com>"]
license = "MIT"
repository = "https://github.com/ZhangHanDong/cowork-skills"
homepage = "https://github.com/ZhangHanDong/cowork-skills"
readme = "README.md"
keywords = ["claude", "skills", "ai", "cli", "agent"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*",
    "builtin-skills/**/*",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

# Main binary
[[bin]]
name = "cowork"
path = "src/main.rs"

# Short alias
[[bin]]
name = "co"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
colored = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Filesystem
dirs = "5.0"
walkdir = "2.4"

# Async runtime
tokio = { version = "1.49", features = ["full"] }

# GitHub API
octocrab = "0.45"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

# Rust parsing
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
quote = "1.0"
proc-macro2 = "1.0"

# Multi-language parsing
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
urlencoding = "2.1"

# Security / Hashing
sha2 = "0.10"

[lints.clippy]
all = "warn"
pedantic = "warn"
